<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OnFood Server Watcher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0b0f19',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-center items-center px-4 sm:px-6 py-12 selection:bg-blue-600 selection:text-white">
    <!-- Background glow for depth -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-blue-900/15 via-slate-950/80 to-slate-950 -z-10 pointer-events-none"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl shadow-2xl shadow-black/60 p-8 backdrop-blur-sm transition-all duration-200">
            <!-- Header Section -->
            <div class="text-center">
                <!-- Icon Emblem -->
                <div class="mx-auto inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-800/90 border border-slate-700/60 shadow-inner text-2xl mb-4 select-none">
                    🛡️
                </div>
                <!-- Title with shield emoji -->
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                    <span>🛡️</span>
                    <span>OnFood Server Watcher</span>
                </h1>
                <p class="mt-2 text-sm text-slate-400">
                    Sign in to access system metrics & live dashboard
                </p>
            </div>

            <!-- Error Alert Box -->
            {% if error %}
            <div class="mt-6 flex items-start gap-3 rounded-xl border border-red-500/30 bg-red-950/40 p-3.5 text-sm text-red-300 shadow-sm animate-fade-in" role="alert">
                <svg class="h-5 w-5 flex-shrink-0 text-red-400 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                </svg>
                <div class="flex-1">
                    <span class="font-semibold text-red-200">Authentication Error:</span>
                    <span class="block text-red-300/90 text-xs mt-0.5">{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <!-- Form -->
            <form id="loginForm" action="/login" method="POST" class="mt-6 space-y-5">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                        Username
                    </label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <!-- User SVG Icon -->
                            <svg class="h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required 
                            autofocus
                            autocomplete="username" 
                            placeholder="Enter username"
                            class="block w-full rounded-lg border border-slate-700/80 bg-slate-800/80 pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm focus:border-blue-500 focus:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
                        />
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                        Password
                    </label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <!-- Lock SVG Icon -->
                            <svg class="h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            autocomplete="current-password" 
                            placeholder="••••••••"
                            class="block w-full rounded-lg border border-slate-700/80 bg-slate-800/80 pl-10 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm focus:border-blue-500 focus:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors"
                        />
                        <!-- Visibility Toggle -->
                        <button 
                            type="button" 
                            id="togglePassword" 
                            tabindex="-1"
                            aria-label="Toggle password visibility"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 transition-colors focus:outline-none cursor-pointer"
                        >
                            <!-- Eye icon (shown when hidden) -->
                            <svg id="eyeIcon" class="h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <!-- Eye-slash icon (shown when visible) -->
                            <svg id="eyeSlashIcon" class="hidden h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button with loading state -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full flex items-center justify-center rounded-lg bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/25 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 cursor-pointer"
                    >
                        <!-- Spinner (hidden by default) -->
                        <svg id="submitSpinner" class="hidden animate-spin -ml-1 mr-2.5 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="submitBtnText">Sign In</span>
                    </button>
                </div>
            </form>

            <!-- Card Footer -->
            <div class="mt-8 pt-5 border-t border-slate-800/80 text-center">
                <p class="text-xs text-slate-500 font-medium tracking-wide uppercase flex items-center justify-center gap-1.5 select-none">
                    <svg class="h-3.5 w-3.5 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                    </svg>
                    Authorized personnel only
                </p>
            </div>
        </div>

        <!-- Optional subtle bottom note -->
        <p class="mt-6 text-center text-xs text-slate-600 select-none">
            &copy; OnFood Systems &bull; Watcher Daemon Service
        </p>
    </div>

    <!-- UI Enhancements (Password toggle & Button loading state on submit) -->
    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (eyeIcon && eyeSlashIcon) {
                    eyeIcon.classList.toggle('hidden', isPassword);
                    eyeSlashIcon.classList.toggle('hidden', !isPassword);
                }
            });
        }

        // Submit button loading state during standard form POST
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitSpinner = document.getElementById('submitSpinner');
        const submitBtnText = document.getElementById('submitBtnText');

        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', function() {
                if (loginForm.checkValidity()) {
                    // Update visual state to loading
                    submitSpinner.classList.remove('hidden');
                    submitBtnText.textContent = 'Signing in...';
                    submitBtn.classList.add('opacity-80', 'cursor-not-allowed', 'pointer-events-none');
                    // Delay disabling so the browser initiates standard form POST
                    setTimeout(function() {
                        submitBtn.disabled = true;
                    }, 50);
                }
            });
        }
    </script>
</body>
</html>
